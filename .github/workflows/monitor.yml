name: monitor cargador Iberdrola

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          pip install playwright requests
          playwright install --with-deps chromium
      - name: Recuperar estado anterior
        uses: actions/cache@v4
        with:
          path: estado_anterior.txt
          key: estado-cargador-${{ github.run_id }}
          restore-keys: |
            estado-cargador-
      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_ESPOSA: ${{ secrets.TELEGRAM_CHAT_ID_ESPOSA }}
        run: python monitor.py

      - name: Guardar captura
        uses: actions/upload-artifact@v4
        with:
          name: datos-iberdrola
          path: iberdrola.json
